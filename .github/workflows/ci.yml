name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      # The app uses PostgreSQL-only SQL, so the suite must run against a real
      # PostgreSQL — never a SQLite stand-in.
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Prepare the application
        run: |
          cp .env.example .env
          php artisan key:generate

      # Parallel testing needs to create per-process databases alongside "testing".
      - name: Grant database creation to the test user
        run: PGPASSWORD=password psql -h 127.0.0.1 -U sail -d testing -c 'ALTER USER sail CREATEDB;'

      - name: Check formatting
        run: composer run lint:check

      - name: Static analysis
        run: composer run analyse

      - name: Run tests
        run: php artisan test --parallel
