	//start for keyboard use
	var key1 = "69"; //E
	var key2 = "101"; //e
	var x = '';
	var movement;
	movement = true;

	function handler(e) {
		if (movement == true) {
			if (document.all) {
				var evnt = window.event;
				x = evnt.keyCode;
			} else {
				x = e.charCode;
			}

							if (x == key1) {
					location.href = "/world.php";
				}
				if (x == key2) {
					location.href = "/world.php";
				}
					}
	}
	if (!document.all) {
		window.captureEvents(Event.KEYPRESS);
		window.onkeypress = handler;
	} else {
		document.onkeypress = handler;
	}
	//end of keyboard use
</script>
