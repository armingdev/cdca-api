<script type="text/javascript">
function getCookie(player){
    var i,x,y,ARRcookies=document.cookie.split(";");
    for (i=0;i<ARRcookies.length;i++){
      x=ARRcookies[i].substr(0,ARRcookies[i].indexOf("="));
      y=ARRcookies[i].substr(ARRcookies[i].indexOf("=")+1);
      x=x.replace(/^\s+|\s+$/g,"");
      if (x == player)
      {
        return 'oldPlayer';
      }
      else
      {
        return 'newPlayer';
      }
    }
}

function setCookie(newPlayer,value,exdays)
{
var exdate=new Date();
exdate.setDate(exdate.getDate() + exdays);
var c_value=escape(value) + ((exdays==null) ? "" : "; expires="+exdate.toUTCString());
document.cookie=newPlayer + "=" + c_value;
}

function checkCookie()
{ 
    var status = getCookie("player"); 
    // New Player
    if (status == 'newPlayer'){ 
        var anchor = $('<a rel="shadowbox;height=510;width=778" class="sbox"  href="/mob_talk?id=59293&stepid=3071&userspawn="><img src="/landing/bigbubble.png" style="position:absolute;top:300px;left:600px;"></a>');
        $('#mydiv').append(anchor);
        anchor.click(function(){
            setCookie('player','oldPlayer',365);
            $(this).remove();
        });
    }    
}
</script>

function positiontip(e){
	var curX=(ns6)?e.pageX : event.x+ietruebody().scrollLeft;
	var curY=(ns6)?e.pageY : event.y+ietruebody().scrollTop;
		
	//Find out how close the mouse is to the corner of the window
	var rightedge=ie4&&!window.opera? ietruebody().clientWidth-event.clientX-offsetxpoint : window.innerWidth-e.clientX-offsetxpoint-20
	var bottomedge=ie4&&!window.opera? ietruebody().clientHeight-event.clientY-offsetypoint : window.innerHeight-e.clientY-offsetypoint-20

	var leftedge=(offsetxpoint<0)? offsetxpoint*(-1) : -1000

	//if the horizontal distance isn't enough to accomodate the width of the context menu
	if (rightedge<tipobj.offsetWidth)
		//move the horizontal position of the menu to the left by it's width
		tipobj.style.left=ie4? ietruebody().scrollLeft+event.clientX-tipobj.offsetWidth+"px" : window.pageXOffset+e.clientX-tipobj.offsetWidth+"px"
	else if (curX<leftedge)
		tipobj.style.left="5px"

		//position the horizontal position of the menu where the mouse is positioned
		tipobj.style.left=curX+offsetxpoint+"px"

		tipobj.style.top=curY+offsetypoint+"px"
	
	tipobj.style.visibility="visible"

		server = "";
	}

    if(!price) {

    }

		gems = 0;
	}

	requester = createRequester();
	requester.onreadystatechange = function(){
		if(requester.readyState == 4 && requester.status == 200){
			tipobj.innerHTML = requester.responseText;
		}
	}
